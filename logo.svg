<svg width="400" height="120" viewBox="0 0 400 120" xmlns="http://www.w3.org/2000/svg">
  <rect width="400" height="120" fill="#0a0a0a" rx="16"/>
  
  <!-- Outer Glow Circle -->
  <circle cx="60" cy="60" r="32" fill="#00ff41" fill-opacity="0.1" stroke="#00ff41" stroke-opacity="0.3" stroke-width="2">
    <animate attributeName="stroke-opacity" values="0.3;0.6;0.3" dur="2s" repeatCount="indefinite" />
  </circle>
  
  <!-- Inner Pulse Circle -->
  <circle cx="60" cy="60" r="8" fill="#00ff41">
    <filter id="glow" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="4" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </circle>
  
  <!-- Logo Text -->
  <text x="120" y="65" font-family="monospace" font-weight="900" font-size="42" fill="white" letter-spacing="-2">VOID-OS</text>
  
  <!-- Subtext -->
  <text x="120" y="95" font-family="monospace" font-weight="bold" font-size="12" fill="#00ff41" letter-spacing="4" opacity="0.8">NEURAL IMAGE PROCESSOR</text>
  
  <!-- Decorative Glitch Lines -->
  <line x1="120" y1="72" x2="300" y2="72" stroke="#00ff41" stroke-width="0.5" opacity="0.2" />
</svg>
